<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Personal Manager</title>
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--label:#000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.14);--fill:rgba(118,118,128,.12);--tint:#007aff;
  --red:#ff3b30;--orange:#ff9500;--green:#34c759;--indigo:#5856d6;--purple:#af52de;--gray:#8e8e93;
  --mat:rgba(246,246,248,.72);--mat-edge:rgba(255,255,255,.5);--shadow:0 8px 30px rgba(0,0,0,.12);
  --ease:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000;--card:#1c1c1e;--label:#fff;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55);--fill:rgba(118,118,128,.24);--tint:#0a84ff;
  --red:#ff453a;--orange:#ff9f0a;--green:#30d158;--indigo:#5e5ce6;--purple:#bf5af2;--gray:#98989d;
  --mat:rgba(28,28,30,.72);--mat-edge:rgba(255,255,255,.08);--shadow:0 8px 30px rgba(0,0,0,.5);
}}
@media (prefers-contrast:more){:root{--sep:rgba(60,60,67,.5);--label2:rgba(60,60,67,.85)}}
@media (prefers-reduced-transparency:reduce){:root{--mat:var(--card)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--label);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.006em}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
.press{transition:transform 100ms ease-out,background-color 120ms}
.press:active{transform:scale(.97)}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100vh}
/* Sidebar: heavier material, structural */
.sidebar{background:var(--mat);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-right:.5px solid var(--sep);padding:20px 10px;overflow:auto}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;text-align:left;font-size:15px}
.nav button svg{width:20px;height:20px;flex:none;stroke:var(--tint);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{background:var(--fill);font-weight:600}
.nav .n{margin-left:auto;font-size:12px;font-weight:600;color:#fff;background:var(--red);border-radius:99px;padding:0 7px;min-width:20px;text-align:center}
.nav hr{border:0;border-top:.5px solid var(--sep);margin:8px 10px;width:calc(100% - 20px)}

.content{overflow:auto;position:relative;min-width:0}
/* Toolbar: light material floating over scrolling content */
.toolbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 24px;background:var(--mat);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:.5px solid var(--sep)}
.toolbar .ttl{font-weight:600;font-size:15px;opacity:0;transform:translateY(4px);transition:opacity 200ms,transform 200ms var(--ease)}
.toolbar.scrolled .ttl{opacity:1;transform:none}
.toolbar .sp{flex:1}
.fresh{font-size:12px;color:var(--label2);font-variant-numeric:tabular-nums}
.icon-btn{width:30px;height:30px;border-radius:50%;background:var(--fill);display:grid;place-items:center}
.icon-btn svg{width:16px;height:16px;stroke:var(--tint);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.spin svg{animation:spin .7s linear infinite}
.icon-btn.spin{pointer-events:none}
.fresh[hidden]{display:none!important}
.fresh.flash{color:var(--tint)}
.fresh{transition:color 600ms}
@keyframes spin{to{transform:rotate(360deg)}}

.page{max-width:1240px;margin:0 auto;padding:6px 24px 80px;animation:in 380ms var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.022em;margin:8px 0 2px}
.subtitle{color:var(--label2);font-size:15px;margin:0 0 18px}
.gh{font-size:12px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.06em;margin:22px 16px 6px}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.group>*{position:relative}
.group>*+*::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.later>summary{cursor:pointer;list-style:none;display:block}.later>summary::-webkit-details-marker{display:none}.later>summary::before{content:'›';display:inline-block;margin-right:6px;transition:transform 200ms var(--ease)}.later[open]>summary::before{transform:rotate(90deg)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px;align-items:start}
@media (max-width:1000px){.cols{grid-template-columns:1fr}}
.pr{padding:10px 16px;cursor:pointer}
.pr-main{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--label3)}
.st-active{background:var(--green)}.st-on-hold{background:var(--orange)}.st-idea{background:var(--tint)}.st-unknown{background:var(--red)}
.pr-when{font-size:13px;color:var(--label2);font-variant-numeric:tabular-nums;white-space:nowrap}
.pr-name{font-weight:600}.pr-spacer{flex:1}
.pr-ev{display:none}
.pr.open .pr-ev{display:block}
.field.need{box-shadow:0 0 0 2px var(--red)}
.pr-sub{color:var(--label2);font-size:13px;margin:3px 0 0 17px}.pr-sub.ph{opacity:.6;font-style:italic}
.pr-next{font-size:13px;margin:3px 0 0 17px}.pr-next b{color:var(--tint);font-weight:600;margin-right:6px}
.pr-chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0 17px}
.chip{font-size:11px;font-weight:600;border-radius:5px;padding:1px 6px;background:var(--fill);color:var(--label2)}
.chip.graded{color:var(--red)}.chip.paid{color:var(--green)}.chip.focus{background:var(--tint);color:#fff}.chip.pause{color:var(--orange)}
.chip.risk{color:var(--orange);background:color-mix(in srgb,var(--orange) 14%,transparent)}
.pr.paused .pr-name,.pr.paused .pr-sub,.pr.paused .pr-next{opacity:.6}
.pr-edit{display:grid;grid-template-columns:100px minmax(0,1fr);gap:8px 10px;align-items:center;margin:10px 0 2px 17px}
.pr-edit .l{color:var(--label2);font-size:13px}.pr-edit .field{width:100%}.pr-edit select{justify-self:start}
.pr-facts{color:var(--label2);font-size:12px;margin:12px 0 2px 17px;line-height:1.5}
.pr-draft{margin:10px 0 0 17px;font-size:13px;color:var(--label2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pr-notes{margin:12px 0 0 17px;padding:10px 14px;background:var(--fill);border-radius:10px;font-size:13px;cursor:text}
.pr-notes p{margin:0 0 6px}.pr-notes .mdh{font-weight:600;margin-top:10px}.pr-notes .mdh:first-child{margin-top:0}
.pr-notes ul{margin:2px 0 6px;padding-left:20px}.sg{padding:12px 16px}.sg-main{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sg-when{font-size:15px;margin-top:3px}.sg-notes,.sg-src{font-size:13px;color:var(--label2);margin-top:3px}
.sg-warn{font-size:13px;color:var(--orange);font-weight:500;margin-top:4px}
.sg-edit{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.sg-edit[hidden]{display:none}.sg-edit .field{width:100%}
.sg-edit [data-e=title],.sg-edit [data-e=location]{grid-column:1/-1}
.sg-actions{display:flex;gap:8px;margin-top:10px}

.empty{padding:14px 16px;color:var(--label2)}
.foot{font-size:12px;color:var(--label2);margin:8px 16px 0}

.banner{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--red) 14%,var(--card));border-radius:12px;padding:12px 14px;margin:6px 0 16px;color:var(--label)}
.banner b{color:var(--red)}
.banner svg{width:20px;height:20px;flex:none;stroke:var(--red);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}


/* Gym */
.gcard{padding:16px 18px}
.ghead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:12px}
.gtitle{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.15}.gsub{color:var(--label2);font-size:13px;margin-top:2px;font-variant-numeric:tabular-nums}
.gstats{display:flex;gap:22px}.gstat{text-align:right}.gstat b{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:block;line-height:1.15}
.gstat b i{font-style:normal;font-size:13px;font-weight:500;color:var(--label2);margin-left:1px}.gstat small{font-size:12px;color:var(--label2)}
.gbar{height:100%;background:var(--green);border-radius:2px;transition:width 500ms var(--ease)}
.gcard .lb{height:5px;margin:0 0 14px}
.gnote{margin:0 0 12px;padding:10px 14px;background:var(--fill);border-radius:10px;font-size:14px;color:var(--label);max-width:75ch}
.gfind{display:flex;flex-direction:column}
.gf{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-top:.5px solid var(--sep);font-size:14px}
.gfn{font-weight:500}.gft{color:var(--label2);text-align:right}.gft.pr{color:var(--green);font-weight:600}
.gweeksw{padding:14px 18px 10px}
.gweeks{display:flex;gap:14px;align-items:flex-start;overflow-x:auto}
.gw{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:34px}
.gwb{height:44px;width:18px;display:flex;align-items:flex-end;background:var(--fill);border-radius:5px;overflow:hidden}.gwb i{display:block;width:100%;background:var(--tint);border-radius:5px}
.gw b{font-size:13px;font-variant-numeric:tabular-nums}.gw small{font-size:11px;color:var(--label2)}
.gexday{margin-top:18px;color:var(--label)}.gexday:first-of-type{margin-top:6px}.gexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.gex{background:var(--card);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.gex-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.gex-name{font-weight:600;line-height:1.25}
.chip.pr{background:var(--green);color:#fff}
.gex-best{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}.gex-best small{display:block;font-size:12px;font-weight:400;letter-spacing:0;color:var(--label2);margin-top:2px}
.gex-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--label2);margin-top:4px}.gex-foot b{color:var(--label);font-variant-numeric:tabular-nums}.gex-foot em{font-style:normal;font-size:12px}
.spark{width:84px;height:26px;flex:none;fill:none;stroke:var(--tint);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.spark circle{fill:var(--tint);stroke:none}
.gex-meta{font-size:12px;color:var(--label2)}
.gprop{display:flex;gap:12px;padding:12px 16px;align-items:center}.gprop .txt{flex:1;min-width:0}.gprop small{display:block;color:var(--label2);font-size:13px}
.gday{color:var(--label2);font-size:13px}.gshift{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0}.gshift span{color:var(--label2);font-weight:400}
.gbtns{display:flex;gap:8px;flex:none}.gbtn{height:30px;padding:0 14px;border-radius:99px;background:var(--fill);color:var(--tint);font-size:13px;font-weight:600}.gbtn.pri{background:var(--tint);color:#fff}
@media (prefers-reduced-motion:reduce){.gbar{transition:none}}

.gex{cursor:pointer;transition:background 150ms var(--ease)}.gex:hover{background:var(--fill)}
.gback{display:inline-flex;align-items:center;gap:4px;color:var(--tint);font-size:15px;font-weight:500;padding:4px 0;margin-bottom:6px}
.gtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px}
.gtile{background:var(--card);border-radius:12px;padding:12px 14px}.gtile small{display:block;font-size:12px;color:var(--label2)}
.gtile b{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.gtile b i{font-style:normal;font-size:13px;font-weight:500;color:var(--label2);margin-left:2px}
.gchart{padding:14px 16px 8px;position:relative}.gchart .hit{fill:transparent;cursor:pointer}
.gtip{position:absolute;z-index:5;pointer-events:none;background:var(--card2,#2c2c2e);border:.5px solid var(--sep);border-radius:10px;padding:9px 12px;font-size:12px;line-height:1.5;color:var(--label2);box-shadow:0 6px 24px rgba(0,0,0,.45);white-space:nowrap}.gtip b{color:var(--label);font-variant-numeric:tabular-nums}.gtip>b{display:block;font-size:13px}.gchart svg{max-width:100%;height:auto;display:block;margin:0 auto;overflow:visible}
.gchart .ln{fill:none;stroke:var(--tint);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.gchart .dt{fill:var(--tint)}
.gchart .ax{fill:var(--label2);font-size:11px;font-variant-numeric:tabular-nums}.gchart .gl{stroke:var(--sep);stroke-width:.5}
.ghist{display:flex;justify-content:space-between;gap:16px;padding:10px 16px;border-top:.5px solid var(--sep);font-size:14px}
.ghist:first-child{border-top:0}.ghist .d{color:var(--label2);font-size:12px}.ghist .sets{color:var(--label);font-variant-numeric:tabular-nums;text-align:right}
.ghist .up{color:var(--green);font-size:12px;font-weight:600}.ghist .dn{color:var(--orange);font-size:12px;font-weight:600}
/* Calendar-style event row */
.ev{display:flex;gap:12px;padding:10px 16px;align-items:stretch}
.ev .when{width:46px;flex:none;font-size:13px;font-variant-numeric:tabular-nums;line-height:1.3}
.ev .when small{display:block;color:var(--label2);font-size:12px}
.ev .bar{width:4px;border-radius:2px;flex:none;background:var(--gray)}
.ev .what{flex:1;min-width:0;font-weight:500}
.ev .what small{display:block;font-weight:400;color:var(--label2);font-size:13px;margin-top:1px}
.ev .flag{align-self:center;font-size:12px;font-weight:600;color:var(--orange);flex:none}
/* One colour per kind of thing: class blue, meeting indigo, gym green, graded red, travel orange, social purple */
.k-class{--c:var(--tint)}.k-meeting{--c:var(--indigo)}.k-gym{--c:var(--green)}.k-deadline{--c:var(--red)}
.k-travel,.k-flight{--c:var(--orange)}.k-event,.k-social{--c:var(--purple)}.k-task,.k-routine,.k-calendar{--c:var(--gray)}
.ev .bar{background:var(--c,var(--gray))}
.t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--label2)}
.content{container:ct/inline-size}
/* Inside the native app window (app/main.swift) the page runs under the traffic lights. */
html.native .sidebar{padding-top:48px}
/* No bar: status and buttons float at the right of the title row, as one glass pill group. */
html.native .page{padding-top:44px}
html.native .toolbar{position:relative;height:0;padding:0 22px;border:0;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;align-items:flex-start;justify-content:flex-end;gap:8px;pointer-events:none}
html.native .toolbar>*{pointer-events:auto;position:relative;top:57px}
html.native .toolbar .ttl,html.native .toolbar .sp{display:none}
html.native .toolbar .fresh{height:30px;display:flex;align-items:center;padding:0 12px;border-radius:99px;background:var(--mat);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--mat-edge)}
html.native .toolbar .icon-btn{background:var(--mat);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--mat-edge)}
html.native .chat{padding-top:28px}
.cols.wide-l{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
@media (max-width:1000px){.cols.wide-l{grid-template-columns:1fr}}

.hero{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:14px;padding:16px 18px;margin-top:6px;box-shadow:inset 4px 0 0 var(--c,var(--tint))}
.hero>div:first-child{flex:1;min-width:0}
.hero-t{font-size:20px;font-weight:600;letter-spacing:-.014em;line-height:1.2;margin:3px 0 2px}
.hero-s{color:var(--label2);font-size:13px}
.hero-cd{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--c,var(--tint));white-space:nowrap}
.plan{background:color-mix(in srgb,var(--tint) 10%,var(--card));border-radius:14px;padding:12px 16px;margin-top:10px}
.plan p{margin:3px 0 0}
.tlwrap{max-height:min(560px,calc(100vh - 330px))}
.tl{position:relative}
.tlwrap{display:flex;flex-direction:column;padding:0;overflow:hidden}
.group+.tlwrap{margin-top:8px}
.tlsc{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:18px 14px 18px 58px;-webkit-mask-image:linear-gradient(transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);mask-image:linear-gradient(transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%)}
.tlbar{flex:none;display:flex;gap:6px;align-items:center;padding:7px 14px 7px 58px;overflow:hidden}.tlbar:empty{display:none}
.tlbar.up{border-bottom:.5px solid var(--sep)}.tlbar.dn{border-top:.5px solid var(--sep)}
.tlchip{min-width:0;max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;line-height:20px;padding:0 9px;border-radius:10px;
  color:color-mix(in srgb,var(--c,var(--gray)) 78%,var(--label));background:color-mix(in srgb,var(--c,var(--gray)) 22%,var(--card));transition:transform 100ms ease-out,filter 120ms}
.tlchip i{font-style:normal;margin-right:4px;opacity:.8}.tlchip b{font-weight:600;font-variant-numeric:tabular-nums}.tlchip:hover{filter:brightness(1.15)}.tlchip:active{transform:scale(.96)}
.tlmn{font-size:11px;color:var(--label2);flex:none}
.wmore{position:sticky;bottom:0;margin-top:-4px;position:absolute;left:2px;right:2px;bottom:2px;display:flex;flex-direction:column;gap:2px;z-index:5}
.wmore .tlchip{max-width:100%;text-align:left}
.wb,.ev[data-ev]{cursor:pointer}
.tb{position:absolute;overflow:hidden;border-radius:6px;padding:4px 8px 4px 10px;font-size:12px;line-height:1.3;cursor:pointer;
  --t:color-mix(in srgb,var(--c,var(--gray)) 78%,var(--label));
  background:color-mix(in srgb,var(--c,var(--gray)) 22%,var(--card));color:var(--t);box-shadow:inset 3px 0 0 var(--c,var(--gray));
  transition:transform 100ms ease-out,filter 120ms}
.tb:hover{filter:brightness(1.12)}.tb:active{transform:scale(.985)}
.tb.one{padding-top:3px;padding-bottom:3px}
.tb .tt{font-weight:600;font-size:13px;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tb .tz{font-weight:500;opacity:.8;font-variant-numeric:tabular-nums}
.tb .tm{display:flex;align-items:center;gap:4px;margin-top:1px;font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.tb .ti{width:11px;height:11px;flex:none}
.tnow{position:absolute;left:-54px;right:0;border-top:1.5px solid var(--red);z-index:4;pointer-events:none}
.tnow span{position:absolute;left:0;top:-9px;padding:0 6px;height:18px;line-height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.tb{transition:none}}
.th{position:absolute;left:0;right:0;border-top:.5px solid var(--sep)}
.th span{position:absolute;left:-50px;top:-8px;font-size:11px;color:var(--label2);font-variant-numeric:tabular-nums}
/* Click popup, like Calendar.app's event popover */
.pop{position:fixed;z-index:50;width:300px;max-width:calc(100vw - 24px);display:flex;gap:12px;padding:14px 16px 14px 14px;border-radius:14px;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);box-shadow:var(--shadow),inset 0 0 0 .5px var(--mat-edge);animation:popin .16s var(--ease)}
@keyframes popin{from{opacity:0;transform:scale(.96)}}
.pop .pbar{width:4px;border-radius:2px;flex:none;background:var(--c,var(--gray))}
.pop .pb{min-width:0;flex:1}.pop .pt{font-size:16px;font-weight:600;line-height:1.25;letter-spacing:-.01em;overflow-wrap:anywhere}
.pop .pw{color:var(--label2);font-size:13px;margin-top:2px;margin-bottom:12px}
.pop a{color:var(--tint);text-decoration:none;overflow-wrap:anywhere}.pop a:hover{text-decoration:underline}

<div class="app" id="app">
  <nav class="sidebar">

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let WKINFO = null;
const WK_BASE = -28, WK_N = 120; let wkX = -WK_BASE, wkInit = true, scrollMem = {};
let mailPoll = false, D = null, gymEx = null, gymWeek = null, laterOpen = true, openRows = new Set(), view = (location.hash || '#today').slice(1);
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

const ICON = {

  week: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 10v10M15 10v10"/>',

  inbox: '<path d="M4 13l2.2-7a1 1 0 0 1 1-.7h9.6a1 1 0 0 1 1 .7L20 13v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M4 13h4.5l1 2h5l1-2H20"/>',
  suggest: '<path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z"/>',

  notes: '<path d="M6 3.5h8l4 4V20a.5.5 0 0 1-.5.5h-11A.5.5 0 0 1 6 20z"/><path d="M14 3.5V8h4M9 12h6M9 15.5h6"/>',
};
function gymWeekView(key, g) {
  const fmt = d => new Date(d + 'T12:00').toLocaleDateString('en-GB', {weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'});
  const wk = d => { const t = new Date(d + 'T12:00'); t.setDate(t.getDate() + 3 - (t.getDay() + 6) % 7); const y = t.getFullYear(), j = new Date(y, 0, 4); return `${y}-W${String(1 + Math.round(((t - j) / 864e5 - 3 + (j.getDay() + 6) % 7) / 7)).padStart(2, '0')}`; };
  const log = (g.log || []).filter(s => wk(s.date) === key).sort((a, b) => a.date.localeCompare(b.date));
  const num = w => w == null ? 'BW' : +w, setTxt = sets => { const out = []; sets.forEach(x => { const t = num(x.w) + '×' + x.reps, l = out[out.length - 1]; l && l[0] === t ? l[1]++ : out.push([t, 1]); }); return out.map(([t, c]) => c > 1 ? `${c} × ${t}` : t).join('  ·  '); };
  const sets = log.reduce((n, s) => n + s.exercises.reduce((m, e) => m + (e.sets || []).length, 0), 0);
  const vol = log.reduce((n, s) => n + s.exercises.reduce((m, e) => m + (e.sets || []).reduce((a, x) => a + (x.w || 0) * x.reps, 0), 0), 0);
  const feelCol = f => f <= 2 ? 'var(--orange)' : f >= 4 ? 'var(--green)' : 'var(--tint)';
  const cards = log.map(s => `<div class="gh">${esc(fmt(s.date))} · ${esc(s.day)}${s.feel ? ` · feel <span style="color:${feelCol(s.feel)}">${s.feel}/5</span>` : ''}</div><div class="group">
    ${s.note ? `<div class="gnote" style="padding:10px 16px">${esc(s.note)}</div>` : ''}

  return `<button class="gback press" data-gback>‹ Gym</button><h1>${esc(key.slice(5))} · ${esc(key.slice(0, 4))}</h1><p class="subtitle">${log.length} session${log.length === 1 ? '' : 's'}</p>

    ${cards || '<div class="group"><div class="empty">No sessions this week.</div></div>'}`;
}
function gymDetail(e, g) {

    const out = [];

    return out.map(([t, c]) => c > 1 ? `${c} × ${t}` : t).join('  ·  ');
  };
  const first = h[0], last = h[h.length - 1], gain = h.length > 1 ? +(last.strength - first.strength).toFixed(1) : null;
  const vols = h.map(r => r.volume), tile = (l, v, u) => `<div class="gtile"><small>${l}</small><b>${v}${u ? `<i>${u}</i>` : ''}</b></div>`;

        <span class="pr-spacer"></span><span class="pr-when" title="${esc(r.last_msg)}">${r.last_active ? ago(r.last_active) : ''}</span>
        <select data-n="${esc(r.file)}" aria-label="Status">${D.statuses.map(x => `<option ${x === r.status ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
      ${r.summary ? `<div class="pr-sub">${esc(r.summary)}</div>` : live(r) ? '<div class="pr-sub ph">No description yet</div>' : ''}
      ${r.next ? `<div class="pr-next"><b>Next</b>${esc(r.next)}</div>` : ''}
      ${rk.length || r.waiting ? `<div class="pr-chips">${r.waiting ? `<span class="chip">Waiting: ${esc(r.waiting)}</span>` : ''}${rk.map(x => `<span class="chip risk">${esc(x)}</span>`).join('')}</div>` : ''}
      <div class="pr-ev">
        ${dr.length ? `<div class="pr-draft">Drafted from your notes, not yet confirmed: ${esc(dr.join(', '))}. Edit what's wrong. <button class="pill ghost press" data-draft="${esc(r.file)}">Looks right</button></div>` : ''}
        <div class="pr-edit">${field(r, 'summary', 'Description', 'What is it?')}${field(r, 'next', 'Next step', 'The one next action')}
          <span class="l">Purpose</span><select data-p="${esc(r.file)}" data-f="purpose" aria-label="Purpose">${opts([['', 'Not set'], ['graded', 'Graded'], ['paid', 'Paid'], ['own', 'Own project']], r.purpose || '')}</select>
          <span class="l">This week</span><select data-p="${esc(r.file)}" data-f="this_week" aria-label="This week">${opts([['', 'Normal'], ['focus', 'Focus'], ['pause', 'Pause']], r.this_week || '')}</select>
          ${field(r, 'waiting', 'Waiting on', 'Person or thing, optional')}
          ${r.status === 'on-hold' ? '' : field(r, 'revisit', 'Revisit', 'Date or trigger')}</div>
        ${r.body ? `<div class="pr-notes">${md(r.body)}</div>` : ''}
        <div class="pr-facts">${r.last_msg ? `Last real commit: “${esc(r.last_msg)}” (${esc(r.last_active)})<br>` : ''}${r.path ? `Folder: ~/Developer/${esc(r.path)}<br>` : ''}${r.repo ? `Repo: ${esc(r.repo)}<br>` : ''}${esc(r.evidence)}</div>
      </div></div>`;
    };
    const sections = [['Studies and work', ['course', 'internship', 'programme']], ['Ventures', ['venture']], ['Software projects', ['project']], ['Tools', ['tool']]];
    const rank = r => ({active: 0, 'on-hold': 1, idea: 2, unknown: 3})[r.status] ?? 4;
    const wk = r => ({focus: 0, '': 1, pause: 2})[r.this_week || ''];
    const lv = D.registry.filter(live), names = l => l.map(r => r.name).join(', ');
    const focus = lv.filter(r => r.this_week === 'focus'), paused = lv.filter(r => r.this_week === 'pause');
    let html = `<h1>Projects</h1><p class="subtitle">${lv.length} live · ${D.registry.length - lv.length} archived or completed${focus.length ? ' · Focus: ' + esc(names(focus)) : ''}${paused.length ? ' · Paused: ' + esc(names(paused)) : ''}</p>${banner()}`;
    if (flags.length) html += `<div class="gh">Needs a look · ${new Set(flags.map(f => f[0])).size}</div><div class="group">${[...new Set(flags.map(f => f[0]))].map(r => `<div class="rem"><span class="dot st-${esc(r.status)}" style="margin-top:7px"></span><div class="txt"><b>${esc(r.name)}</b><small>${flags.filter(f => f[0] === r).map(f => esc(f[1])).join(' · ')}</small></div></div>`).join('')}</div>`;
    for (const [title, kinds] of sections) {
      const rs = D.registry.filter(r => kinds.includes(r.kind) && live(r)).sort((a, b) => rank(a) - rank(b) || wk(a) - wk(b) || (b.last_active || '').localeCompare(a.last_active || '') || a.name.localeCompare(b.name));
      if (rs.length) html += `<div class="gh">${title} · ${rs.length}</div><div class="group">${rs.map(row).join('')}</div>`;
    }
    const done = D.registry.filter(r => !live(r)).sort((a, b) => a.name.localeCompare(b.name));
    if (done.length) html += `<details class="later"><summary class="gh">Archived and completed · ${done.length}</summary><div class="group">${done.map(row).join('')}</div></details>`;
    return html + '<p class="foot">Last activity is the newest real commit (hover for its message); automatic backup commits are ignored. Changing a status marks it confirmed. Fields save when you leave them.</p>';
  },
  inbox() {
    const done = (D.inbox_log || []).flatMap(e => e.results.map(r => ({...r, at: e.at}))).slice(0, 12);
    const when = at => `${new Date(at).toDateString() === new Date().toDateString() ? 'Today' : longDay(at.slice(0, 10))} · ${at.slice(11, 16)}`;
    const asks = done.filter(r => r.needs_user);
    return `<h1>Inbox</h1><p class="subtitle">Reminders and files from your phone, filed automatically</p>${banner()}
      ${asks.length ? `<div class="gh">Needs you · ${asks.length}</div><div class="group">${asks.map(r => `<div class="rem"><div class="txt"><span class="t">${esc(r.needs_user)}</span><small>${esc(r.item)}</small></div></div>`).join('')}</div>` : ''}
      <div class="gh">Filed</div>
      <div class="group">${done.length ? done.map(r => `<div class="rem"><div class="txt"><span class="t">${esc(r.summary || r.item)}</span><small>${esc([when(r.at), ...r.did].join(' · '))}</small></div></div>`).join('') : '<div class="empty">Nothing filed yet.</div>'}</div>
      <div class="gh">Waiting to be picked up</div>
      <div class="group"><div id="inbox-body" class="empty">Not checked yet.</div></div>
      <p style="margin:14px 0 0"><button class="pill press" id="inbox-load">Check Inbox</button></p>
      <p class="foot">Add from your phone: the Reminders list “Manager Inbox”, or screenshots to the iCloud Drive folder “Manager Inbox”. Once the automatic inbox is installed (scripts/install_inbox.sh), new items are filed within a few minutes and anything that needs a decision shows up above.</p>`;
  },
  system() {
    const rows = D.health || [], bad = rows.filter(h => h.level !== 'ok');
    const dot = l => `<span class="hdot h-${l}" aria-label="${l}"></span>`;
    const row = h => `<div class="rem">${dot(h.level)}<div class="txt"><span class="t">${esc(h.name)}</span><small>${esc(h.detail)}</small></div></div>`;
    return `<h1>System</h1><p class="subtitle">${bad.length ? `${bad.length} thing(s) to look at` : 'Everything is running'} · checked every minute</p>${banner()}
      ${bad.length ? `<div class="gh">Needs a look · ${bad.length}</div><div class="group">${bad.map(row).join('')}</div>` : ''}
      <div class="gh">All checks</div><div class="group">${rows.map(row).join('') || '<div class="empty">No checks yet.</div>'}</div>
      <p class="foot">Same checks in the terminal: python3 scripts/health.py. Errors mean something is broken (a job not running, a stale calendar); warnings mean look soon.</p>`;
  },
  suggest() {
    const m = D.mail || {}, new_ = pending(), done = (D.proposals || []).filter(p => p.status !== 'new').slice(-15).reverse();
    const when = it => {
      const d = it.start.slice(0, 10), t = it.start.length > 10 ? it.start.slice(11, 16) : '', te = it.end && it.end.length > 10 && it.end.slice(0, 10) === d ? it.end.slice(11, 16) : '';
      return `${longDay(d)}${t ? ' · ' + t + (te ? '–' + te : '') : ' · all day'}`;
    };
    const overlaps = it => {
      if (it.all_day || it.start.length < 11) return [];
      const d = it.start.slice(0, 10), a0 = hm(it.start.slice(11, 16)), a1 = it.end && it.end.length > 10 ? hm(it.end.slice(11, 16)) : a0 + 60;
      return collect(d, addDays(d, 1)).filter(r => r.t && r.kind !== 'routine' && hm(r.t) < a1 && a0 < (r.te ? hm(r.te) : hm(r.t) + 60)).map(r => `${r.title} (${r.t})`);
    };
    const card = p => {
      const it = p.item, ov = p.kind === 'new' ? overlaps(it) : [], ex = p.existing, f = p.fields || {};
      const src = `From ${esc(p.source.sender.replace(/<.*>/, '').trim() || p.source.sender)}: “${esc(p.source.subject.trim())}”`;
      let body, add = 'Add to calendar';
      if (p.kind === 'enrich') { add = 'Add the info'; body = `<div class="sg-when">Already in your calendar: <b>${esc(ex.title)}</b>, ${esc(longDay(ex.start.slice(0,10)))}${ex.start.length > 10 ? ' · ' + ex.start.slice(11, 16) : ''}</div><div class="sg-when">The mail adds: ${[f.location ? 'location “' + esc(f.location) + '”' : '', f.end ? 'end time ' + esc(f.end.slice(11, 16)) : ''].filter(Boolean).join(' and ')}</div>`; }
      else if (p.kind === 'note') body = `<div class="sg-when">Already in your <b>${esc(ex.calendar)}</b> calendar: ${esc(ex.title)}, ${esc(longDay(ex.start.slice(0,10)))}. The mail adds ${[f.location ? 'location “' + esc(f.location) + '”' : '', f.end ? 'end time ' + esc(f.end.slice(11, 16)) : ''].filter(Boolean).join(' and ')}, but I can only write to Private. Add it by hand if you want it.</div>`;
      else { if (it.type === 'task') add = 'Add as task'; body = `<div class="sg-when">${esc(when(it))}${it.location ? ' · ' + esc(it.location) : ''}</div>${it.notes ? `<div class="sg-notes">${esc(it.notes)}</div>` : ''}`; }
      const kindChip = p.kind === 'new' ? (it.type === 'task' ? 'Task' : 'Event') : p.kind === 'enrich' ? 'More info' : 'Info only';
      return `<div class="sg" data-id="${esc(p.id)}">
        <div class="sg-main"><b>${esc(it.title)}</b><span class="chip">${kindChip}</span>${it.confidence === 'estimated' ? '<span class="chip risk">estimated</span>' : ''}</div>
        ${body}${ov.length ? `<div class="sg-warn">Overlaps: ${esc(ov.join(', '))}</div>` : ''}
        <div class="sg-src">${src}</div>
        <div class="sg-edit" hidden>
          <input class="field" data-e="title" value="${esc(it.title)}" aria-label="Title">
          <input class="field" data-e="start" type="${it.all_day ? 'date' : 'datetime-local'}" value="${esc(it.start)}" aria-label="Start">
          <input class="field" data-e="end" type="${it.all_day ? 'date' : 'datetime-local'}" value="${esc(it.end || '')}" aria-label="End">
          <input class="field" data-e="location" value="${esc(it.location)}" placeholder="Location" aria-label="Location"></div>
        <div class="sg-actions">${p.kind === 'note' ? '' : `<button class="pill press" data-sg="add">${add}</button>`}${p.kind === 'new' ? '<button class="pill ghost press" data-sg="edit">Edit</button>' : ''}<button class="pill ghost press" data-sg="dismiss">${p.kind === 'note' ? 'Got it' : 'Dismiss'}</button><button class="pill ghost press" data-sg="block" title="Dismiss and never suggest anything from this sender again">Never from this sender</button></div></div>`;
    };
    const mailLine = m.ran_at ? `Mail checked ${Math.round(mins(m.ran_at)) < 90 ? Math.round(mins(m.ran_at)) + ' min' : Math.round(mins(m.ran_at) / 60) + ' h'} ago · ${m.new_mail || 0} new mail(s), ${m.filtered || 0} filtered out, ${m.picked || 0} looked at, ${m.proposed || 0} suggested` : 'Mail has not been checked yet';
    return `<h1>Suggestions</h1><p class="subtitle">${esc(mailLine)} <button class="pill ghost press" id="mail-check" ${m.running ? 'disabled' : ''}>${m.running ? 'Checking…' : 'Check mail now'}</button></p>${banner()}
      <div class="gh">Waiting for your yes · ${new_.length}</div>
      <div class="group">${new_.map(card).join('') || '<div class="empty">Nothing new from your mail.</div>'}</div>
      <p class="foot">Pulled from your mail every hour. Nothing is added until you accept it. Accepted events go into your Private calendar; anything already in your calendar is skipped.</p>
      ${(m.skipped || []).length ? `<details class="later"><summary class="gh">Mails I did not read · ${m.skipped.length}</summary><div class="group">${m.skipped.map(x => `<div class="rem"><div class="txt">${esc(x.subject.trim())}<small>${esc(x.sender.split('<')[0].trim())} · ${esc(x.received.slice(0, 10))}</small></div><button class="pill ghost press" data-rm="${esc(x.mid)}">Read this one</button></div>`).join('')}</div></details>` : ''}
      ${done.length ? `<details class="later"><summary class="gh">Handled · ${done.length}</summary><div class="group">${done.map(p => `<div class="rem"><div class="txt">${esc(p.item.title)}<small>${esc(p.status === 'added' ? 'Added' : 'Dismissed')} · ${esc(p.item.start.slice(0, 10))}</small></div></div>`).join('')}</div></details>` : ''}`;
  },
  gym() {
    const g = D.gym;
    if (!g.sessions) return `<h1>Gym</h1><p class="subtitle">Nothing logged yet</p>${banner()}<div class="group"><div class="rem"><div class="txt">Log workouts in the Gym app on your phone; they land here within 15 minutes of saving.</div></div></div>`;
    if (gymWeek) return gymWeekView(gymWeek, g);
    if (gymEx) { const e = g.exercises.find(x => x.name === gymEx); if (e) return gymDetail(e, g); gymEx = null; }
    const rv = g.review || {}, se = rv.session, wkTxt = rv.weekly;
    const wkEntries = Object.entries(g.weeks).slice(-8), wkMax = Math.max(1, ...wkEntries.map(e => e[1]));
    const feelCol = f => f <= 2 ? 'var(--orange)' : f >= 4 ? 'var(--green)' : 'var(--tint)';
    const spark = (ser, w = 96, h = 28) => {
      if (!ser || ser.length < 2) return '';
      const lo = Math.min(...ser), hi = Math.max(...ser), r = hi - lo || 1;
      const pts = ser.map((v, i) => [(i / (ser.length - 1)) * (w - 6) + 3, h - 4 - ((v - lo) / r) * (h - 8)]);
      const last = pts[pts.length - 1];
      return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts.map(q => q.map(n => n.toFixed(1)).join(',')).join(' ')}"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.6"/></svg>`;
    };
    const props = (g.proposals || []).map(p => `<div class="gprop"><div class="txt"><b>${esc(p.exercise)}</b> <span class="gday">${esc(p.day)}</span><div class="gshift">${p.from} <span>→</span> ${p.to} kg</div><small>${esc(p.reason)}</small></div>
      <div class="gbtns"><button class="gbtn pri press" data-gp="${esc(p.id)}" data-ga="apply">Update plan</button><button class="gbtn press" data-gp="${esc(p.id)}" data-ga="dismiss">Dismiss</button></div></div>`).join('');
    let sesHtml = '';
    if (se) {
      const pct = se.sets_planned ? Math.round(100 * se.sets_done / se.sets_planned) : 0;
      const notes = (se.exercises || []).filter(e => e.note && /low day|stall|stuck|under|skipp|PR|\+/i.test(e.note) || e.pr || e.skipped);
      sesHtml = `<div class="gh">Latest session</div><div class="group gcard">
        <div class="ghead"><div><div class="gtitle">${esc(se.day)}</div><div class="gsub">${esc(se.date)}</div></div>
          <div class="gstats"><div class="gstat"><b>${se.sets_done}<i>/${se.sets_planned}</i></b><small>sets</small></div>
          ${se.feel ? `<div class="gstat"><b style="color:${feelCol(se.feel)}">${se.feel}<i>/5</i></b><small>feel</small></div>` : ''}</div></div>
        <div class="lb"><div class="gbar" style="width:${pct}%"></div></div>
        ${se.note ? `<p class="gnote">${esc(se.note)}</p>` : ''}
        ${notes.length ? `<div class="gfind">${notes.map(e => `<div class="gf"><span class="gfn">${esc(e.name)}</span><span class="gft${e.pr ? ' pr' : ''}">${esc(e.pr ? 'New PR' : e.skipped ? 'Skipped' : e.note)}</span></div>`).join('')}</div>` : ''}</div>`;
    } else if (wkTxt) sesHtml = '';
    const wkHtml = wkTxt ? `<div class="gh">This week</div><div class="group"><div class="rem"><div class="txt" style="white-space:pre-line">${esc(wkTxt.text)}</div></div></div>` : '';
    const propHtml = props ? `<div class="gh">Proposed changes</div><div class="group">${props}</div>` : '';
    const wkBars = `<div class="gweeks">${wkEntries.map(([k, n]) => `<div class="gw press" data-gweek="${esc(k)}"><div class="gwb"><i style="height:${Math.round(100 * n / wkMax)}%"></i></div><b>${n}</b><small>${esc(k.slice(5))}${k.slice(0, 4) !== String(new Date().getFullYear()) ? `<br>${esc(k.slice(0, 4))}` : ''}</small></div>`).join('')}</div>`;
    const exCard = e => {
      const pr = e.latest != null && e.latest >= e.best && e.sessions > 1;
      return `<div class="gex press" data-gex="${esc(e.name)}"><div class="gex-top"><div class="gex-name">${esc(e.name)}</div>${pr ? '<span class="chip pr">PR</span>' : ''}</div>
        <div class="gex-best">${esc(e.best_set || '–')}<small>best set</small></div>
        <div class="gex-foot"><span>Last <b>${e.history?.length ? new Date(e.history[e.history.length - 1].date + 'T12:00').toLocaleDateString('en-GB', {day: 'numeric', month: 'short', year: 'numeric'}) : '–'}</b></span>${spark(e.series)}</div>
        <div class="gex-meta">${e.sessions} session${e.sessions === 1 ? '' : 's'}${e.skipped ? ` · skipped ${e.skipped}×` : ''}</div></div>`;
    };
    // group by plan day (plan order); exercises not in the plan fall under "Other"
    const plan = g.plan || {}, byDay = {};
    g.exercises.forEach(e => {
      const d = Object.keys(plan).find(k => plan[k].order.includes(e.name)) || 'Other';
      (byDay[d] = byDay[d] || []).push(e);
    });
    const dayKeys = [...Object.keys(plan).filter(k => byDay[k]), ...(byDay.Other ? ['Other'] : [])];
    const ex = dayKeys.map(d => {
      const list = byDay[d].sort((x, y) => (plan[d]?.order.indexOf(x.name) ?? 0) - (plan[d]?.order.indexOf(y.name) ?? 0) || x.name.localeCompare(y.name));
      return `<div class="gh gexday">${d === 'Other' ? 'Not in current plan' : esc(d) + (plan[d]?.title ? ` · ${esc(plan[d].title)}` : '')}</div><div class="gexgrid">${list.map(exCard).join('')}</div>`;
    }).join('');
    return `<h1>Gym</h1><p class="subtitle">${g.sessions} sessions · last ${esc(g.last)}</p>${banner()}
      ${propHtml}${sesHtml}${wkHtml}
      <div class="gh">Sessions per week</div><div class="group gweeksw">${wkBars}</div>
      <div class="gh">Exercises</div>${ex}`;
  },
  notes() {
    return `<h1>Notes</h1><p class="subtitle">state.md, read-only</p>${banner()}<div class="group"><pre class="mono">${esc(D.state_md)}</pre></div>`;
  },
};

/* ---------- wiring ---------- */
function nav() {
  $('nav').innerHTML = VIEWS.map(v => {
    if (!v) return '<hr>';
    const n = v[0] === 'review' ? unconfirmed().length : v[0] === 'suggest' ? pending().length : v[0] === 'system' ? (D.health || []).filter(h => h.level === 'error').length : 0;
    return `<button class="press ${v[0] === view ? 'on' : ''}" data-v="${v[0]}"><svg viewBox="0 0 24 24">${ICON[v[0]]}</svg>${v[1]}${n ? `<span class="n">${n}</span>` : ''}</button>`;
  }).join('');
  $('nav').querySelectorAll('button[data-v]').forEach(b => b.onclick = () => { gymEx = null; gymWeek = null; view = b.dataset.v; location.hash = view; render(true); $('content').scrollTo(0, 0); });
}
function bind() {
  const p = $('page');
  p.querySelectorAll('[data-done]').forEach(b => b.onclick = async () => { b.classList.add('done'); await api('/api/items/' + b.dataset.done, {status: 'done'}); setTimeout(load, 250); });
  p.querySelectorAll('[data-exp]').forEach(r => r.onclick = e => { if (e.target.closest('select,input,button')) return; r.classList.toggle('open'); openRows[r.classList.contains('open') ? 'add' : 'delete'](r.dataset.name); });
  p.querySelectorAll('[data-rx]').forEach(r => r.onclick = e => { if (!e.target.closest('button')) r.classList.toggle('open'); });
  p.querySelectorAll('.sg [data-sg]').forEach(b => b.onclick = async () => {
    const card = b.closest('.sg'), id = card.dataset.id, act = b.dataset.sg;
    if (act === 'edit') { card.querySelector('.sg-edit').hidden = !card.querySelector('.sg-edit').hidden; return; }
    const item = {};
    if (!card.querySelector('.sg-edit').hidden) card.querySelectorAll('[data-e]').forEach(i => item[i.dataset.e] = i.value);
    b.disabled = true;
    try { await api('/api/proposals/' + id, {action: act, item}); toast(act === 'add' ? 'Added.' : act === 'block' ? 'Dismissed. Nothing more from this sender.' : 'Dismissed.'); } catch { b.disabled = false; return; }
    load();
  });
  p.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => { b.disabled = true; try { await api('/api/mail/recheck', {mid: b.dataset.rm}); } catch { b.disabled = false; return; } toast('Reading it now.'); load(); });
  const mc = $('mail-check');
  if (mc) {
    const poll = () => { if (mailPoll) return; mailPoll = true; const t = setInterval(async () => { await load(); if (!(D.mail && D.mail.running)) { clearInterval(t); mailPoll = false; toast('Mail check finished.'); } }, 4000); };
    mc.onclick = async () => { mc.disabled = true; mc.textContent = 'Checking…'; try { await api('/api/mail/check', {}); } catch { mc.disabled = false; return; } poll(); };
    if (D.mail && D.mail.running) poll();
  }
  p.querySelectorAll('[data-gweek]').forEach(c => c.onclick = () => { gymWeek = c.dataset.gweek; render(true); $('content').scrollTo(0, 0); });
  p.querySelectorAll('[data-gex]').forEach(c => c.onclick = () => { gymEx = c.dataset.gex; render(true); $('content').scrollTo(0, 0); });
  p.querySelectorAll('[data-gback]').forEach(b => b.onclick = () => { gymEx = null; gymWeek = null; render(true); });
  p.querySelectorAll('[data-gp]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await api('/api/gym/proposals/' + b.dataset.gp, {action: b.dataset.ga}); toast(b.dataset.ga === 'apply' ? 'Weight updated in Gym.md.' : 'Dismissed.'); } catch { b.disabled = false; return; }
    load();
  });
  const lt = p.querySelector('details.later'); if (lt && view === 'upcoming') lt.ontoggle = () => laterOpen = lt.open;
  const add = $('nt-add');
  if (add) {
    const go = async () => {
      const title = $('nt-title').value.trim(); if (!title) return;
      await api('/api/items', {type: 'task', title, due: $('nt-due').value, who: D.owner || 'me'}); load();
    };
    add.onclick = go; $('nt-title').onkeydown = e => { if (e.key === 'Enter') go(); };
  }

let chat = [], chatModel = 'smart', chatBusy = false;
const store = {get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} }};
function md(t) {
